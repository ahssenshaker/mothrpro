name: Build Android APK

on:
  push:
    branches: [ "claude/iphone-app-store-w4r9w5", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: Verify Old Architecture is set (newArchEnabled=false in app.json controls this)
        working-directory: mobile/android
        run: grep newArchEnabled gradle.properties

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mothrpro-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install APK on emulator and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.moatherpro.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > full_logcat.txt
            adb logcat -b crash -d > crash_buffer.txt || true
            grep -iE "FATAL|AndroidRuntime|SIGSEGV|SIGABRT|moatherpro|hermes|tombstone|Unsatisfied|ClassNotFound|dlopen" full_logcat.txt > filtered_logcat.txt || echo "no matches" > filtered_logcat.txt
            echo "===== FILTERED LOGCAT ====="
            cat filtered_logcat.txt
            echo "===== CRASH BUFFER ====="
            cat crash_buffer.txt
            echo "===== LAST 200 LINES OF FULL LOGCAT ====="
            tail -200 full_logcat.txt

      - name: Upload crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crash-logs
          path: |
            full_logcat.txt
            crash_buffer.txt
            filtered_logcat.txt
          retention-days: 30
          if-no-files-found: warn

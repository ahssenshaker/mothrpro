name: Build Android APK

on:
  push:
    branches: [ "claude/iphone-app-store-w4r9w5", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project (expo prebuild)
        working-directory: mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > mobile/android/local.properties

      - name: Disable New Architecture for compatibility
        working-directory: mobile/android
        run: |
          sed -i 's/newArchEnabled=true/newArchEnabled=false/g' gradle.properties
          grep newArchEnabled gradle.properties

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mothrpro-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

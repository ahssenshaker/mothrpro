name: Update Follower Stats

on:
  schedule:
    - cron: '0 3 * * 0' # every Sunday at 03:00 UTC (~06:00 Saudi time)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Limit number of records (for testing). Leave empty for all.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run stats updater
        id: updater
        timeout-minutes: 180
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"; fi
          node scripts/update-follower-stats.mjs $ARGS

      - name: Commit report file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/influencers/_stats_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update follower stats report [automated]"
            git push origin HEAD:${{ github.ref_name }}
          fi
